<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paper Trader</title>
<style>
  :root { --bg:#fff; --fg:#16181d; --dim:#5b616b; --accent:#0a8f6c; --rule:#e3e7eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0e0e12; --fg:#f2f3f5; --dim:#9aa0ab; --accent:#2ed3a7; --rule:#24262e; }
  }
  body {
    margin:0; padding:0 20px 60px; background:var(--bg); color:var(--fg);
    font:16px/1.65 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  main { max-width:640px; margin:0 auto; padding-top:64px; }
  .brand { display:flex; align-items:center; gap:12px; margin-bottom:26px; }
  .mark { width:38px; height:38px; border-radius:10px; background:var(--accent);
          display:grid; place-items:center; flex:none; }
  h1 { font-size:28px; margin:0 0 8px; letter-spacing:-0.3px; }
  p { margin:0 0 16px; color:var(--dim); }
  ul { padding-left:20px; }
  li { margin-bottom:10px; }
  a { color:var(--accent); }
  footer { margin-top:40px; padding-top:18px; border-top:1px solid var(--rule);
           color:var(--dim); font-size:14px; }
</style>
</head>
<body>
<main>
  <div class="brand">
    <div class="mark">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="#fff" aria-hidden="true">
        <rect x="3" y="9"  width="4" height="9" rx="1.2"/><rect x="4.3" y="6"  width="1.4" height="15" rx="0.7"/>
        <rect x="10" y="6" width="4" height="9" rx="1.2"/><rect x="11.3" y="3" width="1.4" height="15" rx="0.7"/>
        <rect x="17" y="3" width="4" height="9" rx="1.2"/><rect x="18.3" y="1" width="1.4" height="15" rx="0.7"/>
      </svg>
    </div>
    <strong>Paper Trader</strong>
  </div>

  <h1>Practise F&amp;O with virtual money</h1>
  <p>An Android trading simulator for Indian markets. Every trade is made
     with virtual money — the app cannot place a real order.</p>

  <ul>
    <li><a href="privacy/">Privacy Policy</a></li>
  </ul>

  <footer>
    Contact: <a href="mailto:pradeeplakkadasu@gmail.com">pradeeplakkadasu@gmail.com</a>
  </footer>
</main>
</body>
</html>
